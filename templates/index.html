<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Local con Memoria</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="chat-container">
        <header class="chat-header">
            <div>
                <p class="eyebrow">Ollama + Flask</p>
                <h1>IA Local con memoria JSON</h1>
            </div>

            <button class="memory-button" type="button" onclick="mostrarMemoria()">
                Ver memoria
            </button>
        </header>

        <section class="chat-box" id="chatBox" aria-live="polite">
            <div class="message ai-message">Hola. Soy tu IA local. Estoy lista para ayudarte. Escribe "Que recuerdas de mi?" para ver mi memoria.</div>
        </section>

        <form class="chat-input" onsubmit="enviarMensaje(); return false;">
            <textarea
                id="mensaje"
                rows="1"
                placeholder="Escribe un mensaje..."
                aria-label="Mensaje"
            ></textarea>

            <button type="submit">
                Enviar
            </button>
        </form>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
